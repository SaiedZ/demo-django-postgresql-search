{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PostgreSQL Search Demo{% endblock %}</title>
  <style>
    :root { --border: #dcdfe4; --muted: #6b7280; --bg: #f7f8fa; --accent: #2563eb; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
           color: #1f2937; background: var(--bg); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    a { color: var(--accent); }
    .toplink { font-size: 14px; }
    form.search { margin: 18px 0 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    input[type=text] { flex: 1 1 320px; padding: 9px 11px; border: 1px solid var(--border);
                       border-radius: 6px; font-size: 15px; }
    select, button { padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px;
                     font-size: 14px; background: #fff; }
    button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
    .hint { color: var(--muted); font-size: 13px; margin: 2px 0 14px; }
    .count { font-size: 13px; color: var(--muted); margin: 10px 0; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 8px;
            padding: 12px 14px; margin: 10px 0; }
    .card h3 { margin: 0 0 4px; font-size: 16px; }
    .card p { margin: 4px 0; }
    .card .desc { color: #374151; }
    .card .body { color: var(--muted); font-size: 13px; }
    .score { display: inline-block; margin-top: 6px; font-size: 12px; color: var(--muted);
             background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }
    .empty { color: var(--muted); font-style: italic; }
    .cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 16px; }
    .cols .col { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    .cols h2 { font-size: 15px; margin: 0 0 2px; }
    .cols .coldesc { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
    .cols .mini { border-top: 1px solid var(--border); padding: 8px 0 0; margin-top: 8px; }
    .cols .mini:first-of-type { border-top: 0; }
    .cols .mini strong { font-size: 13px; }
    @media (max-width: 860px) { .cols { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px) { .cols { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>PostgreSQL Search Demo</h1>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
